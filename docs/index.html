<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Generative AI Inventory</title>
    <style>
        body {
            font-family: Vollkorn, Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
        }

        .group {
            display: inline-block;
            border: 1px solid lightgrey;
            border-radius: 6px;
            margin: 18px 18px 18px 18px;
            padding: 10px;
            background-color: #f8f8f8;
            width: 220px;
            vertical-align: top;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
            font-size: 110%;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .icon {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 26px;
            margin-bottom: 20px;
            filter: grayscale(100%);
        }

        body {
            margin: 40px;
            text-align: center;
        }

        ::placeholder {
            color: lightgrey;
            opacity: 1;
        }

        :-ms-input-placeholder {
            color: lightgrey;
        }

        ::-ms-input-placeholder {
            color: lightgrey;
        }

        .advice-as-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 14px;
            color: blue;
        }

        .ingredients {
            font-size: 14px;
            margin-bottom: 10px;
            border-left: 2px solid lightgrey;
            padding-left: 6px;
        }

        .ingredient {
            margin-bottom: 8px;
            font-size: 110%;
        }

        .guest {
            font-size: 12px;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 5px 1px 5px;
            color: black;
        }

        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 17px;
        }

        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }

        .tabcontent {
            display: none;
            padding: 0;
            border: 1px solid #ccc;
            border-top: none;
        }

        .timeline-shell {
            padding: 16px;
            background: #fff;
        }

        .timeline-scroll {
            max-height: calc(100vh - 235px);
            overflow: auto;
            border: 1px solid #cfcfcf;
            background: #fff;
            text-align: left;
        }

        .timeline-table {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            font-family: Ubuntu, Segoe UI, Arial, sans-serif;
            font-size: 12px;
        }

        .timeline-table th,
        .timeline-table td {
            box-sizing: border-box;
            border-right: 1px solid #e1e1e1;
            border-bottom: 1px solid #e1e1e1;
        }

        .timeline-table thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            height: 44px;
            padding: 7px 8px;
            background: #f2f3f3;
            color: #333;
            text-align: center;
            font-weight: 600;
        }

        .timeline-table tbody tr:nth-child(even) td {
            background: #fafafa;
        }

        .timeline-lab-header,
        .timeline-lab-cell {
            position: sticky;
            left: 0;
            width: 190px;
            min-width: 190px;
            max-width: 190px;
        }

        .timeline-table thead .timeline-lab-header {
            z-index: 5;
            text-align: left;
        }

        .timeline-lab-cell {
            z-index: 2;
            padding: 8px;
            background: #fff;
            box-shadow: 3px 0 5px rgba(0, 0, 0, 0.05);
        }

        .timeline-table tbody tr:nth-child(even) .timeline-lab-cell {
            background: #fafafa;
        }

        .timeline-lab-link {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 38px;
        }

        .timeline-lab-mark {
            position: relative;
            width: 46px;
            min-width: 46px;
            height: 34px;
        }

        .timeline-lab-logo {
            width: 42px;
            height: 32px;
            object-fit: contain;
        }

        .timeline-country-flag {
            position: absolute;
            right: -1px;
            bottom: -2px;
            width: 17px;
            height: 17px;
            object-fit: cover;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #c7c7c7;
        }

        .timeline-lab-name {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #202020;
            font-weight: 600;
            line-height: 1.25;
        }

        .timeline-month,
        .timeline-cell {
            width: 146px;
            min-width: 146px;
            max-width: 146px;
        }

        .timeline-month span {
            display: block;
            line-height: 1.2;
        }

        .timeline-month span:last-child {
            color: #777;
            font-size: 10px;
            font-weight: 400;
        }

        .timeline-table thead .timeline-month-latest {
            background: #e7ece9;
        }

        .timeline-cell {
            height: 58px;
            padding: 5px;
            vertical-align: top;
            background: #fff;
        }

        .timeline-year-boundary {
            border-left: 2px solid #929292;
        }

        .timeline-model {
            display: block;
            margin-bottom: 4px;
            padding: 5px 6px;
            overflow: hidden;
            border: 1px solid #d2ddd7;
            border-left: 3px solid #39745a;
            border-radius: 3px;
            background: #eef5f1;
            color: #173326;
            line-height: 1.2;
        }

        .timeline-model:last-child {
            margin-bottom: 0;
        }

        .timeline-model:hover {
            border-color: #8eaa9b;
            background: #e3efe8;
        }

        .timeline-model-name {
            display: block;
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .timeline-model-date {
            display: block;
            margin-top: 3px;
            color: #65716b;
            font-size: 10px;
        }

        .tools-category-header,
        .tools-category-cell {
            position: sticky;
            left: 0;
            width: 230px;
            min-width: 230px;
            max-width: 230px;
        }

        .timeline-table thead .tools-category-header {
            z-index: 5;
            text-align: left;
        }

        .tools-category-cell {
            z-index: 2;
            padding: 9px 10px;
            background: #fff;
            box-shadow: 3px 0 5px rgba(0, 0, 0, 0.05);
            vertical-align: middle;
        }

        .timeline-table tbody tr:nth-child(even) .tools-category-cell {
            background: #fafafa;
        }

        .tools-domain-start th,
        .tools-domain-start td {
            border-top: 3px solid #8b8b8b;
        }

        .tools-category-domain {
            margin-bottom: 6px;
            color: #6c6c6c;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .tools-category-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tools-category-icon {
            width: 30px;
            min-width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .tools-category-name {
            min-width: 0;
            overflow-wrap: anywhere;
            color: #242424;
            font-weight: 600;
            line-height: 1.25;
        }

        .tools-year,
        .tools-cell {
            width: 160px;
            min-width: 160px;
            max-width: 160px;
        }

        .timeline-table thead .tools-year-latest {
            background: #e7ece9;
        }

        .tools-cell {
            height: 68px;
            padding: 6px;
            background: #fff;
            vertical-align: top;
            white-space: nowrap;
        }

        .tools-milestone {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            margin-left: var(--tools-month-offset, 0);
            margin-bottom: 5px;
            padding: 6px;
            overflow: hidden;
            border: 1px solid #d4d8d6;
            border-left: 3px solid #39745a;
            border-radius: 3px;
            background: #f3f6f4;
            color: #222;
            line-height: 1.2;
        }

        .tools-milestone:last-child {
            margin-bottom: 0;
        }

        .tools-milestone:hover {
            border-color: #9ca8a2;
            background: #e9efec;
        }

        .tools-domain-app_agents {
            border-left-color: #376da8;
            background: #f0f4f9;
        }

        .tools-domain-app_agents:hover {
            border-color: #8fa8c2;
            background: #e6edf5;
        }

        .tools-domain-swe_agents {
            border-left-color: #a45c2a;
            background: #f8f2ed;
        }

        .tools-domain-swe_agents:hover {
            border-color: #c2a28c;
            background: #f2e8e0;
        }

        .tools-milestone-logo {
            width: 26px;
            min-width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .tools-milestone-copy {
            min-width: 0;
        }

        .tools-milestone-name {
            display: block;
            overflow-wrap: anywhere;
            font-weight: 600;
        }

        .tools-milestone-meta {
            display: block;
            margin-top: 3px;
            overflow-wrap: anywhere;
            color: #66706b;
            font-size: 10px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 700px) {
            body {
                margin: 12px;
            }

            .site-header {
                padding-left: 0 !important;
            }

            .site-header-logo {
                height: 70px !important;
            }

            .site-title {
                font-size: 24px !important;
                line-height: 1.1;
            }

            .timeline-shell {
                padding: 8px;
            }

            .timeline-scroll {
                max-height: calc(100vh - 270px);
            }

            .timeline-lab-header,
            .timeline-lab-cell {
                width: 126px;
                min-width: 126px;
                max-width: 126px;
            }

            .timeline-lab-link {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .timeline-lab-name {
                font-size: 11px;
            }

            .timeline-month,
            .timeline-cell {
                width: 126px;
                min-width: 126px;
                max-width: 126px;
            }

            .tools-category-header,
            .tools-category-cell {
                width: 146px;
                min-width: 146px;
                max-width: 146px;
            }

            .tools-category-main {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .tools-category-name {
                font-size: 11px;
            }

            .tools-year,
            .tools-cell {
                width: 180px;
                min-width: 180px;
                max-width: 180px;
            }
        }
    </style>

    <script>
        function openTab(evt, cityName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(cityName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>

            return 'logo.png';

        <table>
            <tr style="white-space: nowrap; overflow: hidden;">
                <td>

                    <div class="site-title" style="font-size: 288%;"><b>Generative AI Inventory</b></div>

        <div style="text-align: left; margin-top: 10px; margin-bottom: 20px;">

        <div id="content" style="text-align: left;"></div>

        function getDisplayText(str, filters) {
            if (str && str.length > 0) {
                for (let i in filters.filter(f => f && f.length > 0)) {
                    const filter = filters[i];
                    const lowerStr = str.toLowerCase();
                    const lowerFilter = filter.toLowerCase();
                    const idx = lowerStr.indexOf(lowerFilter);

                    if (idx !== -1) {
                        // Capitalize first letter of str
                        let displayStr = str.charAt(0).toUpperCase() + str.slice(1);
                        // Find the index in the capitalized string
                        let capOffset = 0;
                        if (idx === 0) {
                            capOffset = 0;
                        } else {
                            capOffset = idx;
                        }
                        // Insert <span> around the matched filter
                        return (
                            displayStr.slice(0, capOffset) +
                            '<span style="background: #ffe066;">' +
                            displayStr.slice(capOffset, capOffset + filter.length) +
                            '</span>' +
                            displayStr.slice(capOffset + filter.length)
                        );
                    }
                }
                return str.slice(0, 1).toUpperCase() + str.slice(1);
            }
            return str;
        }

        function matchesAnyFilter(str, filters) {
            for (let i in filters.filter(f => f && f.length > 0)) {
                if (str.toLowerCase().includes(filters[i].toLowerCase())) {
                    return true;
                }
            }
            return false;
        }

                ].join(' '));
                return (item.name + ' ' + models).toLowerCase();
            }
            return data.filter(i => i.name).filter(item => filters.length === 0 || matchesAnyFilter(textToSearch(item), filters));

        function getFilters(filterText) {

        function escapeHtml(value) {
            const replacements = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(value ?? '').replace(/[&<>"']/g, character => replacements[character]);
        }

        function modelMonthKey(releaseDate) {
            const match = /^(\d{4})-(\d{2})(?:-\d{2})?$/.exec(releaseDate || '');
            if (!match) return null;

            const month = Number(match[2]);
            if (month < 1 || month > 12) return null;
            return match[1] + '-' + match[2];
        }

        function timelineMonthKeys(labs) {
            const datedMonths = [];
            labs.forEach(lab => {
                (lab.models || []).forEach(model => {
                    const monthKey = modelMonthKey(model.release_date);
                    if (monthKey) datedMonths.push(monthKey);
                });
            });

            if (datedMonths.length === 0) return [];

            datedMonths.sort();
            const earliestParts = datedMonths[0].split('-').map(Number);
            const latestParts = datedMonths[datedMonths.length - 1].split('-').map(Number);
            const earliest = Date.UTC(earliestParts[0], earliestParts[1] - 1, 1);
            const cursor = new Date(Date.UTC(latestParts[0], latestParts[1] - 1, 1));
            const months = [];

            while (cursor.getTime() >= earliest) {
                months.push(
                    cursor.getUTCFullYear() + '-' + String(cursor.getUTCMonth() + 1).padStart(2, '0')
                );
                cursor.setUTCMonth(cursor.getUTCMonth() - 1);
            }

            return months;
        }

            labs.forEach(lab => {

        function formatMilestoneDate(value) {
            const match = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(value || '');
            if (!match) return value || '';
            const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3] || 1)));
            const options = { month: 'short', timeZone: 'UTC' };
            if (match[3]) options.day = 'numeric';
            return date.toLocaleDateString('en-US', options);
        }

        function toolsMilestoneMonthOffset(value) {
            const match = /^\d{4}-(\d{2})/.exec(value || '');

            const month = Number(match[1]);

        }

                    html += '<div style="padding: 0px; margin: 8px; margin-bottom: 18px; border: 1px solid lightgrey; box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;">';
                        html += '<div style="margin-bottom: 3px; background-color: #f8f8f8;padding: 2px">';
                        html += '<div style="lightgrey; vertical-align: middle; display: inline-block"><img src="assets/' + imageOf(option.provider, option.name) + '" style="vertical-align: middle; height: 26px; width: 26px; vertical-align: top; object-fit: contain;" onerror="this.onerror=null;this.src=\'assets/logo.png\';"></div>';
                        html += '<div style="vertical-align: middle; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; display: inline-block; width: 80px; font-size: 60%; color: grey">' + option.provider + '</div>';
                        html += '</div>';
                        html += '<div style="padding: 4px; font-size: 80%">' + option.name + '</div>';
                    html += '</a>';
                    html += '</div>';
                });
                html += '</td>';
            });
            html += '</tr>';
            html += '</table>';
            html += '</div>';

            document.getElementById('content_' + name).innerHTML = html;
        }

        update();
        updateLlmTimeline(data);
        updateToolsTimeline(toolsTimeline);
        updateRunning(running, 'running');
        updateRunning(agents, 'agents');
        updateRunning(softwareAgents, 'software_agents');
    </script>
</body>
